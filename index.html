/* ============================================================
   SIGNAL BOLD — design tokens · v1.0 (locked 2026-09-05)
   The poster register: a fork of Signal derived by measurement
   from the ICML 2026 poster (see ../../POSTER-ANATOMY.md).

   PALETTE LOCKED 2026-09-05 (Ken):
     blue   #2E5AA6  "Harbor"  — walked from the poster #3343CC toward
                                 the kenpriore.com line-art slate so the
                                 chrome and the illustrations read as one
                                 family (C* 47, hue 218°).
     yellow #F0C919            — held from the poster; a bright surface,
                                 not a rival accent (L* 82).
     rose   #C0455F            — tuned down from the poster #D5385F so it
                                 stops out-shouting Harbor and clears
                                 white-on-rose at 4.93:1 (C* 53).
     red    #EE0F0B            — the ONE exception: appears only in the
                                 hero art, at the moment the machine acts.
                                 Never a token for chrome, text or UI.

   Predecessor: ../../tokens-bold.css (exploration, poster palette).
   Scale: poster 768pt → web container 1180px; body stays 16px.
   ============================================================ */

:root{
  /* ---- colour ---- */
  --paper:#FFFFFF;
  --ink:#17171C;            /* one ink; the poster's five near-blacks collapse here */
  --ink-2:#484951;          /* title remainder, kicker text */
  --muted:#5F5F5F;          /* sub-lines */
  --grey:#E4E5E7;           /* dividers, label border, name band — the only grey stroke */

  --blue:#2E5AA6;           /* Harbor — title emphasis, hero fill, discs, heads, frames */
  --blue-50:rgba(46,90,166,.5);   /* connector rules: primary at 50% alpha, never a second blue */
  --yellow:#F0C919;         /* caution panel header + border */
  --rose:#C0455F;           /* seal panel header + border + chips */

  /* the red exception is deliberately NOT a --token: it lives in the
     illustration layer only. Recorded here as documentation, commented
     out so it cannot be pulled into chrome by habit.
     --red-exception:#EE0F0B;  hero art, the commit moment, nowhere else */

  /* semantic roles */
  --emphasis:var(--blue);   /* blue speaks */
  --caution:var(--yellow);  /* yellow warns */
  --alert:var(--rose);      /* rose seals */
  --hue:var(--blue);        /* property hue; a property may set its own */
  --icon-ground:var(--paper);   /* knockout colour for Bold icons; badges override */

  /* ---- type ---- */
  --slab:"Roboto Slab","Rockwell","Georgia",serif;            /* display: title, hero, heads, numerals */
  --sans:"Archivo","Roboto","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;  /* body, labels */
  --mono:"Roboto Mono","SF Mono",Menlo,Consolas,monospace;    /* chips only */

  /* scale = poster 36/26/20/16/13/11/10pt, body pinned at 16px */
  --fs-display:clamp(34px,3.2vw,44px);   /* title */
  --fs-hero:clamp(24px,2.2vw,30px);      /* hero bar, step heads */
  --fs-h2:22px;                          /* section + panel heads */
  --fs-body:16px;
  --fs-small:13px;                       /* step/panel body, chip labels */
  --fs-label:11px;                       /* kicker, chips */
  --fs-fine:10px;                        /* seal paragraph, sub-lines */
  --lh-display:1.11; --lh-body:1.19; --lh-small:1.23; --lh-fine:1.10;
  --track-kicker:.075em;                 /* one third of Signal's .22em */
  --w-regular:400; --w-bold:700;

  /* ---- grid & space (32px unit) ---- */
  --u:32px;
  --margin:var(--u);
  --gutter:var(--u);
  --gap-block:36px;                      /* recurring 34–39pt block gap */
  --pad-panel:24px;
  --pad-hero:20px;
  --container:1180px;
  --col-2:calc((100% - var(--gutter)) / 2);

  /* ---- structure ---- */
  --border:2px;                          /* colour-matched panel/hero border */
  --hairline:1px;                        /* label box border, --grey */
  --r-box:6px;                           /* containers, outer */
  --r-inner:4px;                         /* containers, inner face */
  --r-pill:999px;                        /* chips, discs, connector ends */
  --disc:32px;                           /* numeral disc */
  --connector:4px;                       /* rule between discs, --blue-50 */
  --zigzag-h:5px; --zigzag-wl:12px;      /* divider: 2px stroke, 12.3pt wavelength */
  --scallop-h:5.5px; --scallop-wl:18px;  /* rose header bottom edge */

  /* ---- icons (Bold sprite) ---- */
  --icon:32px;                           /* Bold draws for 32–40 */
  --icon-row:28px;                       /* in a ledger row beside 16px text */
  --badge:48px;                          /* square badge, r-inner */

  /* ---- motion (inherited from Signal, unchanged) ---- */
  --beat:480ms; --stagger:80ms;
  --ease-cut:cubic-bezier(.2,.7,.1,1); --ease-snap:cubic-bezier(.6,0,.2,1);
}

/* zigzag divider as a CSS background (2px stroke, --grey) */
.zz{height:var(--zigzag-h);background:
  linear-gradient(135deg,var(--grey) 25%,transparent 25%) 0 0/var(--zigzag-wl) var(--zigzag-h),
  linear-gradient(225deg,var(--grey) 25%,transparent 25%) 0 0/var(--zigzag-wl) var(--zigzag-h);
  background-repeat:repeat-x}

@media (prefers-reduced-motion:reduce){:root{--beat:0ms;--stagger:0ms}}

const worldInfo = [
 {title:'CLO becomes COO', short:'Legal becomes part of how the business runs.', body:'Legal work becomes part of the company’s everyday operations. Rules that once lived in advice and contracts are built into shared software. The chief legal officer (CLO) takes on the wider responsibilities of a chief operating officer (COO).', control:'Company lawyers shape the systems the business uses.', gain:'Fewer problems reach legal after the decision has already been made.', tension:'The company gains operational reach by allowing much broader access to its data and activity.', step:'Embedding legal into operations', steps:['Legal begins organizing its data and testing task-specific agents.','Legal agents become part of daily business workflows.','Legal and risk controls move into core enterprise systems.','A small expert team supervises legal capability across the business.']},
 {title:'GC, Chief Legal Strategist',short:'The legal buyer sets the terms.',body:'The general counsel (GC), the company’s senior lawyer, becomes the organizer of a busy market. Specialist tools and advisers compete for work. The legal team controls the budget, keeps its knowledge, and decides who can connect to its systems.',control:'The company’s legal team decides which tools and advisers can use its data.',gain:'The buyer can choose specialist capability while retaining its knowledge and standards.',tension:'Someone must make the parts work together and remain accountable when they fail.',step:'Organizing a fragmented market',steps:['Legal starts reclaiming its data and choosing its own tools.','Legal-specific systems develop around confidentiality and privilege needs.','Buyers require common standards and access to matter history.','The general counsel directs a network of competing systems and advisers.']},
 {title:'Default judgment',short:'The company depends on infrastructure built elsewhere.',body:'Law firms and technology companies build the systems through which legal work gets done. Companies use them because they are faster and more capable than what they could build themselves. In-house lawyers still set risk limits, but depend on infrastructure owned elsewhere.',control:'External firms and platforms own much of the infrastructure.',gain:'Companies access legal capability they could not readily build themselves.',tension:'Efficiency comes with dependence on outside systems, data rules and commercial incentives.',step:'Becoming dependent on external infrastructure',steps:['Legal teams continue buying services from separate firms and vendors.','Providers invest in technology and begin consolidating.','Agreements, disputes and compliance move into external infrastructure.','In-house lawyers set risk appetite inside systems owned by others.']},
 {title:'Human judgment on top',short:'People retain the authority to challenge the system.',body:'Much of legal work is automated, until failures reveal what the machines have missed. People retain the final say on fairness, trust and judgment. The unresolved question is whether they have enough knowledge and independence to exercise that power.',control:'People hold final judgment above an integrated system.',gain:'Automation operates alongside human responsibility for fairness, trust and judgment.',tension:'The people in charge need the skill, independence and practical power to intervene.',step:'Making human authority effective',steps:['Legal technology spreads while the profession debates its boundaries.','Users adopt automation faster than professional structures adapt.','Failures expose the limits of machine-led legal judgment.','People are expected to understand, manage and challenge the system.']}

function horizonsSection(){return `<section class="section horizons-section" id="three-horizons" aria-labelledby="horizons-title"><div class="section-head"><div><div class="eyebrow">A way to think about change</div><h2 id="horizons-title">Three Horizons starts<br>with the present.</h2></div><div class="editorial-context"><p>Three Horizons has roots in <a href="https://h3uni.org/wp-content/uploads/2016/11/Seeing_in_Multiple_Horizons_Connecting.pdf">futures research from the mid-2000s</a>. Bill Sharpe, a former Hewlett-Packard research director, explored it in his 2013 book, <a href="https://www.triarchypress.net/three-horizons.html"><em>Three Horizons: The Patterning of Hope</em></a>.</p><p>Its premise: the established system, experiments with change, and the beginnings of a different future are all here at once.</p></div></div><div class="three-cols horizons-grid"><article class="finding"><span class="horizon-label">H1 / The present</span><h3>The system we rely on.</h3><p>Courts, contracts and professional judgment keep legal work moving. This horizon asks what remains valuable and where familiar arrangements are falling short.</p></article><article class="finding"><span class="horizon-label">H2 / The transition</span><h3>The experiments in between.</h3><p>A faster contract-review tool might extend today’s practice. A new way to deliver legal help might change who can get it.</p></article><article class="finding"><span class="horizon-label">H3 / The emerging future</span><h3>A different way of working.</h3><p>Legal help could be built into an everyday decision. This horizon asks which future is worth building, and where its beginnings can already be found.</p></article></div><p class="horizons-workshop">The workshop makes room for all three perspectives: keeping things running, trying something new, and working toward a different future. Pathways paired that conversation with four scenarios for law in 2040. The scenarios give people something concrete to disagree about, and a way to test their plans.</p></section>`;}
function overview(){return `<section class="hero"><div><div class="eyebrow">Pathways · The future of law</div><h1>Four futures for law.<br><strong>Choices we can<br>make today.</strong></h1><p class="lead">As more legal work moves into software, control can move with it: to a company’s own lawyers, to outside providers, or to the systems themselves. Pathways brought legal leaders and technology builders together to explore four versions of that future. This companion lets you explore the choices behind them.</p><div class="actions"><a class="button" href="#/outcomes">See what we landed ${arrow}</a><a class="text-link" href="#/navigator">Explore the worlds ${arrow}</a></div></div>${programArt()}</section>
 ${horizonsSection()}
 <aside class="reading"><div>${chip('My reading')}</div><div><p>Across these possible futures, a practical question keeps returning: who can stop the system when it gets something wrong?</p><small>The in-house group proposed an override switch. The human-judgment scenario asked who would have the authority to use it.</small></div></aside>
 <section class="section"><div class="route-links"><a class="route-link" href="#/navigator"><div><div class="eyebrow">The scenario explorer</div><h3>Follow the choices into 2040.</h3><p>Change who leads, how the technology connects, or who has the final say.</p></div><span aria-hidden="true">↗</span></a><a class="route-link" href="#/outcomes"><div><div class="eyebrow">The outcome</div><h3>What landed. What is still open.</h3><p>See how the same future looks to a company, a law firm or someone seeking legal help.</p></div><span aria-hidden="true">↗</span></a></div></section>`;}
function selected(){return PROGRAM.cells.find(c=>c.n===selectedCell);}
function scenarioFor(cell){return PROGRAM.scenarios.find(s=>s.id===cell.scenarioId);}
function displayAxis(key,value){return ({tech:{Integrated:'Integrated',Fragmented:'Fragmented'},role:{'Buyer disruption':'Buyers lead','Status quo':'Others lead'},law:{Algocracy:'Algorithms lead','Human supremacy':'Humans decide'}})[key][value];}
const AXIS_TIPS={
 'Integrated':'Legal work runs through one connected system: shared data and common standards across the business.',
 'Fragmented':'Many specialist tools that never settle on one standard. Each holds its own data.',
 'Buyers lead':'The company’s own legal team uses its budget and data to set the terms.',
 'Others lead':'In-house rides along while firms, vendors and the market drive the change.',
 'Algorithms lead':'Software increasingly makes and runs the legal call.',
 'Humans decide':'People keep the final say and can challenge or stop the machine.'
};
function axisGlossary(){return `<section class="axis-glossary" aria-label="What the terms mean"><h3>What the terms mean</h3><dl>${Object.entries(AXIS_TIPS).map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl></section>`;}
function group(label,key,opts,explanation){return `<div class="control-group"><span class="control-label" id="label-${key}">${label}</span><div class="segmented" role="group" aria-labelledby="label-${key}">${opts.map(v=>`<button data-axis="${key}" data-value="${v}" data-tip="${AXIS_TIPS[displayAxis(key,v)]}" aria-pressed="${selected().coords[key]===v}" aria-controls="world-result">${displayAxis(key,v)}</button>`).join('')}</div><p class="small-note">${explanation}</p></div>`;}
function worldPage(){return `${editorialIntro('Explore the worlds','The technology matters.<br><strong>So does who controls it.</strong>',[
 'Legal work could become faster without giving everyone more control. A company might build the systems itself, assemble specialist tools, or depend on infrastructure owned by its advisers. Each arrangement changes who holds the knowledge and who can make the call.',
 'Pathways used scenarios to test those differences. The goal was to see which choices would hold up across plausible futures, and which depended on a particular balance of technology, buying power and human judgment.'
 ])}<p class="reader-guide"><strong>Read the map.</strong> Three choices, with two answers each, make eight combinations. The workshop developed four. Select a world, then change one setting to see what shifts.</p>
 <div class="navigator"><aside class="controls" aria-label="World choices">${group('01 / How technology connects','tech',['Integrated','Fragmented'],'Does legal work run through connected systems, or through separate specialist tools?')}${group('02 / Who drives the change','role',['Buyer disruption','Status quo'],'Companies buy legal services. Do their own legal teams set the terms, or do firms and technology providers lead?')}${group('03 / Where final authority sits','law',['Algocracy','Human supremacy'],'Do algorithms increasingly make the legal call, or can people challenge and overrule them?')}${axisGlossary()}</aside><div><div class="matrix">${matrix()}</div><p class="map-note">The outlined box is your selection. “Undeveloped” marks a combination the workshop left open, not a future it ruled out.</p></div></div>
 <div id="world-result" aria-live="polite">${worldResult()}</div>
 <div class="reading"><div>${chip('Reading the map',true)}</div><div><p>Only one of the four developed worlds puts human judgment on top.</p><small>Only S4, Human judgment on top, was developed on this side of the map. The selection tells us where the workshop focused. It does not tell us which future is most likely.</small></div></div>`;}
function matrix(){return ['Algocracy','Human supremacy'].map((law,idx)=>`<section class="matrix-half"><h2 class="matrix-title ${idx?'human':''}">${idx?'Human authority':'Algorithm-led authority'}</h2><div class="matrix-caption">Top: integrated · Bottom: fragmented<br>Left: buyers lead · Right: others lead</div><div class="cells">${['Integrated','Fragmented'].flatMap(tech=>['Buyer disruption','Status quo'].map(role=>{const c=PROGRAM.cells.find(c=>c.coords.tech===tech&&c.coords.role===role&&c.coords.law===law);const s=scenarioFor(c);return `<button class="world-cell ${s?'':'empty'}" data-cell="${c.n}" aria-pressed="${c.n===selectedCell}" aria-controls="world-result" aria-label="${s?'S'+s.number+' '+s.shortTitle:emptyNames[c.n]+', undeveloped'}"><span class="world-no">${s?'S'+s.number+' / DEVELOPED':'UNDEVELOPED'}</span><strong>${s?s.shortTitle:emptyNames[c.n]}</strong><span class="cell-meta">${displayAxis('role',role)}${s?.number===4?' · Contested':''}</span></button>`;})).join('')}</div></section>`).join('');}
function choiceTrace(c,s){return `<div class="choice-trace" aria-label="Your choices lead to this world">${[['Technology',displayAxis('tech',c.coords.tech)],['Change',displayAxis('role',c.coords.role)],['Authority',displayAxis('law',c.coords.law)],['Result',s?'World '+s.number:'Undeveloped']].map(([label,value],i)=>`<div class="trace-step" style="--i:${i}"><span class="trace-dot">${i<3?i+1:'↗'}</span><small>${label}</small><strong${AXIS_TIPS[value]?` data-tip="${AXIS_TIPS[value]}"`:''}>${value}</strong></div>`).join('')}</div>`;}
function worldResult(){const c=selected(),s=scenarioFor(c);const axes=Object.entries(c.coords).map(([k,v])=>{const d=displayAxis(k,v);return `<span class="term" data-tip="${AXIS_TIPS[d]}">${d}</span>`;}).join(' · ');if(!s)return `${choiceTrace(c,s)}<section class="world-result empty-result"><div class="result-main">${chip('Undeveloped',true)}<h2 style="margin:14px 0">${emptyNames[c.n]}</h2><p>${axes}</p><p style="max-width:650px;margin-top:16px">The workshop named this possibility but did not build out its story. It remains a question on the map, with no imagined timeline attached.${c.n===4?' The Legal Exhaust was deliberately left undeveloped.':''}</p><p class="source-line">Choose a developed world to explore its path to 2040.</p></div></section>`;
 if(!s.timeline[selectedYear])selectedYear='2040';const info=worldInfo[s.number-1];return `${choiceTrace(c,s)}<article class="world-result"><div class="result-top"><div>${chip('S'+s.number+' / Scenario')}<h2>${info.title}</h2><p>${info.body}</p><p class="source-line">${axes}</p></div><aside class="result-side"><h3>Who has control</h3><p>${info.control}</p><h3>The promise</h3><p>${info.gain}</p><h3>The tension</h3><p>${info.tension}</p></aside></div><div class="result-main"><details class="scenario-path"><summary>Read this world’s imagined path to 2040 <span class="disclosure-hint">Explore the turning points</span></summary><div class="timeline-top"><div><div class="eyebrow">The scenario’s imagined path</div><h3 style="margin-top:7px">${info.step}</h3></div><div class="year-buttons" role="group" aria-label="Select scenario year">${scenarioYears(s).map(y=>`<button data-year="${y}" aria-pressed="${selectedYear===y}" aria-controls="timeline-content">${y.replace('-','–')}</button>`).join('')}</div></div><div id="timeline-content" aria-live="polite">${timeline(s)}</div><div class="timeline-warning"><strong>Scenario assumptions.</strong> These events and company examples are part of the scenario, not a report of what has happened.</div></details><div class="world-question"><strong>The question this leaves us with</strong>${escapeHTML(s.questionsThisWorldRaises.governanceAndAccountability)}</div></div></article>`;}
function timeline(s){return `<div class="timeline-content"><div class="year-display">${selectedYear.replace('-','–')}</div><div><p style="font-weight:700;margin-bottom:12px">${worldInfo[s.number-1].steps[scenarioYears(s).indexOf(selectedYear)]}</p><ul>${(s.timeline[selectedYear]||[]).map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div></div>`;}
const groups=[
 {name:'In-house legal',title:'Keep control of the work that needs your judgment.',robust:'Decide which work to keep in-house and which to buy, based on the judgment and trust each task requires.',contingent:'Build an override switch in case of failure.',resilient:'Promote minimum standards for how legal help is provided.',note:'The group also proposed legislation placing explicit responsible-AI duties on the chief legal officer.'},
 {name:'Law firms',title:'Build services around technology, talent and client trust.',robust:'Improve how legal services are delivered.',contingent:'Build the data and technology capability on which the new model depends.',resilient:'Build on talent and client relationships.',note:'The group considered proactive advice, services around products, and combined delivery models across the four scenarios.'},
 {name:'Technology & service providers',title:'Make the tools work for the people using them.',robust:'Connect tools, make them work for customers, and build support for the industry.',contingent:'Get access to the customer’s data and systems so the tools can solve day-to-day problems.',resilient:'Focus on usage and invest in relationships.',note:'The group focused on making technology useful within customer workflows.'},
 {name:'People & small businesses',title:'Make legal help easier to reach and fairer to use.',robust:'Build a political and public campaign around fairness, due process, access and rights.',contingent:'Bring separate groups together, across local communities and institutional leadership.',resilient:'Agree on defaults that people experience as easier, faster and less costly.',note:'The group treated access as a matter of organizing and institutional choices. It also proposed licensing reform and defaults that protect people.'}
];
function outcomePage(){return `${editorialIntro('What we landed','The same future.<br><strong>Different stakes.</strong>',[
 'A legal department may want control of its data. A law firm may want to protect the client relationship. A person priced out of legal help may care most about access. The same technology can serve one interest while unsettling another.',
 'The workshop moved from describing possible worlds to choosing how to act in them. Each group tested what it could do across the scenarios, what would depend on events, and what would help it adapt. The proposals below show the priorities that emerged.'
 ])}
 <section class="callout"><div>${chip('Workshop proposal')}</div><div><h2>“Build an override switch in case of failure.”</h2><p>That was the in-house group’s proposed response to failure. It gives the larger debate a practical test: someone needs the authority, information and means to intervene.</p></div></section>
 <section class="section">${sectionHead('Choose a perspective','What each group would do.','Select a group to see how it approached the same uncertain future. The three headings separate actions that could hold across worlds from conditional responses and ways to adapt.')}<div class="stakeholder-tabs" role="group" aria-label="Choose a stakeholder group">${groups.map((g,i)=>`<button data-stakeholder="${i}" aria-pressed="${stakeholder===i}" aria-controls="stance">${g.name}</button>`).join('')}</div><div id="stance" aria-live="polite">${stance()}</div></section>
 <section class="section">${sectionHead('From discussion to practice','The work that remains.','The exercise produced priorities and proposals. Shared standards, ongoing work and people responsible for carrying it forward still needed to be settled.')}<div class="open-items"><div class="panel"><h2 class="panel-head">What the exercise gave us</h2><div class="panel-body"><ul class="record-list"><li><div><strong>Four futures to test against</strong>A way to examine whether a decision still makes sense when the world changes.</div></li><li><div><strong>Choices and their risks</strong>Each group considered what to do and how its approach could fail.</div></li><li><div><strong>Different kinds of response</strong>Some actions can begin now. Others depend on events or help a group adapt.</div></li></ul></div></div><div class="panel yellow"><h2 class="panel-head">What still needs to be built</h2><div class="panel-body"><ul class="record-list"><li><div><strong>A way to track change</strong>The workshop gathered signals, but left no recorded owner for keeping that watch going.</div></li><li><div><strong>Rules for meaningful human control</strong>The override proposal still needs shared standards for when and how people can intervene.</div></li><li><div><strong>A route into the profession</strong>New roles were discussed. A concrete plan for training and entry-level work remained unassigned.</div></li></ul></div></div></div></section>
 <aside class="reading"><div>${chip('My reading')}</div><div><p>Putting a person in charge only matters if that person can understand the decision and change its course.</p><small>My reading of the workshop: the next step is to decide who can intervene, what they need to know, and how to record what they did.</small></div></aside>`;}
function stance(){const g=groups[stakeholder];return `<article class="stance"><div class="eyebrow">${g.name}</div><h3 style="margin-top:12px">${g.title}</h3><div class="stance-grid"><div><b>Useful across the worlds</b><p>${g.robust}</p><div class="small-note">The workshop called this “robust.”</div></div><div><b>If conditions change</b><p>${g.contingent}</p><div class="small-note">The workshop called this “contingent.”</div></div><div><b>Room to adapt</b><p>${g.resilient}</p><div class="small-note">The workshop called this “resilient.”</div></div></div><p class="source-line">${g.note}</p></article>`;}
function syncWorld(){
 $$('[data-axis]').forEach(b=>b.setAttribute('aria-pressed',String(selected().coords[b.dataset.axis]===b.dataset.value)));
 $$('[data-cell]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.cell)===selectedCell)));
 $('#world-result').innerHTML=worldResult();
 history.replaceState(null,'',`#/navigator/${selectedCell}`);
}
function route(){
 clearTimeout(animationTimer);
 const [raw,detail]=location.hash.replace(/^#\/?/,'').split('/');
 const page=({'worlds':'navigator','how-we-got-here':'overview','program':'overview','convergence':'outcomes'})[raw]||raw||'overview';
 const known=['overview','navigator','outcomes'].includes(page)?page:'overview';
 if(known==='navigator'&&PROGRAM.cells.some(c=>c.n===Number(detail)))selectedCell=Number(detail);
 $$('nav a').forEach(a=>{if(a.getAttribute('href')===`#/${known}`)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 main.innerHTML=({overview,navigator:worldPage,outcomes:outcomePage})[known]();

}
main.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.action==='replay'){
  const art=$('#program-art');art.classList.remove('play');void art.offsetWidth;art.classList.add('play');
 }
 if(b.dataset.axis){const coords={...selected().coords,[b.dataset.axis]:b.dataset.value};selectedCell=PROGRAM.cells.find(c=>Object.keys(coords).every(k=>coords[k]===c.coords[k])).n;syncWorld();}
 if(b.dataset.cell){selectedCell=Number(b.dataset.cell);syncWorld();}
 if(b.dataset.year){selectedYear=b.dataset.year;$$('[data-year]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.year===selectedYear)));$('#timeline-content').innerHTML=timeline(scenarioFor(selected()));}
 if(b.dataset.stakeholder!==undefined){stakeholder=Number(b.dataset.stakeholder);$$('[data-stakeholder]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.stakeholder)===stakeholder)));$('#stance').innerHTML=stance();}
});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({behavior:'instant'});});
window.addEventListener('hashchange',route);
route();
